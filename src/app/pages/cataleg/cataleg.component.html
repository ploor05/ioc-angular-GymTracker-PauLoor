<app-formulari-cerca></app-formulari-cerca>

<div class="panell-preferits">
  <h3>Preferits ({{ preferitsService.totalPreferits() }})</h3>

  <div class="grid">
    <div class="card" *ngFor="let elem of preferitsService.preferits()">
      <h4>{{ elem.name }}</h4>
      <p>Valor: {{ elem.value }}</p>
    </div>
  </div>
</div>

<!-- ESTAT CARREGANT -->
<div *ngIf="elementService.carregant()" class="carregant">
  <div class="spinner"></div>
  <p>Carregant elements...</p>
</div>

<!-- ESTAT ERROR -->
<div *ngIf="elementService.error()" class="error-box">
  <p class="error-text">{{ elementService.error() }}</p>
  <button (click)="reintentar()">Reintentar</button>
</div>

<!-- ESTAT ÈXIT -->
<div *ngIf="!elementService.carregant() && !elementService.error()" class="grid">
  <app-element-card
    *ngFor="let elem of elementService.elements()"
    [element]="elem">
  </app-element-card>
</div>
